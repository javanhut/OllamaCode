# Generated by imlazy migrate from Makefile

[settings]
default = "all"

[variables]
project_name = "ollama-code"
companion_name = "ollama-companion"
version = "1.0.0"
main_entry_point = "main.go # Assuming your main package entry file is main.go"
ldflags = "-X github.com/javanhut/ollama_code/tui.appVersion={{version}}"
uname_s = "$(uname -s)"
default_prefix = "/usr/local"
prefix = "{{default_prefix}}"
bindir = "{{prefix}}/bin"
destdir = ""

[commands]

[commands.all]
desc = "Default target: setup modules, build, and run"
dep = ["setup", "run"]

[commands.setup]
desc = "Target to set up the Go environment (downloads modules and verifies dependencies)"
run = [
  "echo \"--- Running Setup Phase: Tidy Go Modules for {{project_name}} ---\"",
  "go mod tidy || { echo \"Error: Failed to run go mod tidy. Ensure you are in the project root.\"; exit 1; }",
  "echo \"Setup complete.\"",
]

[commands.build]
desc = "Target to build the cross-platform executable binary"
run = [
  "echo \"--- Building {{project_name}} Binary ---\"",
  "# Build for current OS/Architecture",
  "go build -v -ldflags \"{{ldflags}}\" -o {{project_name}} .",
  "# To cross-compile for Linux on macOS, for example:",
  "# GOOS=linux GOARCH=amd64 go build -v -o {{project_name}}_linux .",
  "echo \"Build complete. Binary named {{project_name}} created.\"",
]
dep = ["setup"]

[commands.install]
desc = "Target to install the built binary into PATH."
run = [
  "echo \"--- Installing {{project_name}} ---\"",
  "echo \"OS: {{uname_s}}\"",
  "echo \"Install path: {{destdir}}{{bindir}}/{{project_name}}\"",
  "mkdir -p \"{{destdir}}{{bindir}}\"",
  "install -m 0755 \"{{project_name}}\" \"{{destdir}}{{bindir}}/{{project_name}}\"",
  "echo \"Install complete.\"",
]
dep = ["build"]

[commands.uninstall]
desc = "Target to uninstall the installed binary."
run = [
  "echo \"--- Uninstalling {{project_name}} ---\"",
  "if [ -f \"{{destdir}}{{bindir}}/{{project_name}}\" ]; then rm -f \"{{destdir}}{{bindir}}/{{project_name}}\"; echo \"Removed {{destdir}}{{bindir}}/{{project_name}}\"; else echo \"No installed binary found at {{destdir}}{{bindir}}/{{project_name}}\"; fi",
  "echo \"Uninstall complete.\"",
]

[commands.run]
desc = "Target to run the application using the compiled binary"
run = [
  "echo \"--- Running {{project_name}} using compiled binary ---\"",
  "./{{project_name}}",
]
dep = ["build"]

[commands.dev]
desc = "Target to run the application during development (no build step)"
run = [
  "echo \"--- Running {{project_name}} in development mode ---\"",
  "go run {{main_entry_point}}",
]
dep = ["setup"]

[commands.build-companion]
desc = "Build the optional Gio-based popup companion (separate binary)."
run = [
  "echo \"--- Building {{companion_name}} ---\"",
  "go build -v -o {{companion_name}} ./cmd/companion",
  "echo \"Companion build complete: {{companion_name}}\"",
]

[commands.run-companion]
desc = "Build then run the companion."
run = ["./{{companion_name}}"]
dep = ["build-companion"]

[commands.dev-companion]
desc = "Fast iteration: run the companion without producing a binary."
run = ["go run ./cmd/companion"]

[commands.install-companion]
desc = "Install the optional companion binary."
run = [
  "echo \"--- Installing {{companion_name}} ---\"",
  "echo \"OS: {{uname_s}}\"",
  "echo \"Install path: {{destdir}}{{bindir}}/{{companion_name}}\"",
  "mkdir -p \"{{destdir}}{{bindir}}\"",
  "install -m 0755 \"{{companion_name}}\" \"{{destdir}}{{bindir}}/{{companion_name}}\"",
  "echo \"Install complete.\"",
]
dep = ["build-companion"]

[commands.uninstall-companion]
desc = "Uninstall the optional companion binary."
run = [
  "echo \"--- Uninstalling {{companion_name}} ---\"",
  "if [ -f \"{{destdir}}{{bindir}}/{{companion_name}}\" ]; then rm -f \"{{destdir}}{{bindir}}/{{companion_name}}\"; echo \"Removed {{destdir}}{{bindir}}/{{companion_name}}\"; else echo \"No installed binary found at {{destdir}}{{bindir}}/{{companion_name}}\"; fi",
  "echo \"Uninstall complete.\"",
]

[commands.clean]
desc = "Target to clean generated files and directories"
run = [
  "echo \"--- Cleaning up built files and directories ---\"",
  "rm -f {{project_name}} {{companion_name}} build/ dist/ *.pyc",
  "echo \"Cleanup complete.\"",
]

[commands.test]
desc = "runs go test"
alias = ["t"]
run = ["go test ./..."]

[commands.format]
desc = "Runs go format on binary"
alias = ["fmt"]
run = ["go fmt ./..."]

[commands.fix]
desc = "Runs go fix on binary"
alias = ["fx"]
run = ["go fix ./..."]
